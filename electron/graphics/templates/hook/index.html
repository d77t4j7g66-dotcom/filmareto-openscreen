<!doctype html>
<html
	data-graphic-name="Hook"
	data-graphic-hold="2.7"
	data-composition-variables='[
		{"id":"small","type":"string","label":"Μικρή λέξη","default":"Πώς κάνεις"},
		{"id":"big","type":"string","label":"Μεγάλη λέξη","default":"ZOOM"},
		{"id":"sub","type":"string","label":"Υπότιτλος","default":"σε 10 δευτερόλεπτα"}
	]'
>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Filmareto Inter";
				src: url("../_shared/Inter.ttf");
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#root {
				position: absolute;
				inset: 0;
				font-family: "Filmareto Inter", system-ui, sans-serif;
				color: #fff;
			}
			#lockup {
				position: absolute;
				left: 6%;
				right: 6%;
				top: 62%;
				transform: translateY(-50%);
				text-align: center;
			}
			#grow {
				display: inline-block;
				animation: grow 3s linear 0s 1 both;
				transform-origin: 50% 50%;
			}
			#fade {
				animation: fade 3s linear 0s 1 both;
			}
			#small {
				display: block;
				text-align: left;
				font-size: 5.4vmin;
				font-weight: 700;
				letter-spacing: -0.02em;
				margin-bottom: -2.6vmin;
				position: relative;
				z-index: 1;
				text-shadow: 0 0.3vmin 1.2vmin rgba(0, 0, 0, 0.55);
			}
			#big {
				display: block;
				font-size: 24vmin;
				line-height: 1;
				font-weight: 900;
				letter-spacing: -0.05em;
				white-space: nowrap;
				background: linear-gradient(180deg, #fff 0%, #e4e6ea 42%, #a5a9b3 62%, #f4f5f7 100%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				filter: drop-shadow(0 0.5vmin 1.6vmin rgba(0, 0, 0, 0.5));
				padding: 0 0.04em;
			}
			#sub {
				display: block;
				text-align: right;
				font-size: 4.6vmin;
				font-weight: 700;
				letter-spacing: -0.01em;
				margin-top: -1.4vmin;
				text-shadow: 0 0.3vmin 1.2vmin rgba(0, 0, 0, 0.55);
			}
			@keyframes grow {
				from {
					transform: scale(1);
				}
				to {
					transform: scale(1.08);
				}
			}
			@keyframes fade {
				0%,
				3% {
					opacity: 0;
					filter: blur(2vmin);
				}
				9%,
				91% {
					opacity: 1;
					filter: blur(0);
				}
				100% {
					opacity: 0;
					filter: blur(1.2vmin);
				}
			}
		</style>
	</head>
	<body>
		<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-fit-format>
			<div id="lockup" class="clip" data-start="0" data-duration="3">
				<div id="fade" data-start="0">
					<div id="grow" data-start="0">
						<span id="small" data-var-text="small">Πώς κάνεις</span>
						<span id="big" data-var-text="big" data-fit-width="0.86">ZOOM</span>
						<span id="sub" data-var-text="sub">σε 10 δευτερόλεπτα</span>
					</div>
				</div>
			</div>
		</div>
		<script src="../_shared/graphic.js"></script>
	</body>
</html>
