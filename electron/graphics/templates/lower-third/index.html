<!doctype html>
<html
	data-graphic-name="Όνομα"
	data-graphic-hold="3.6"
	data-composition-variables='[
		{"id":"name","type":"string","label":"Όνομα","default":"Νεκτάριος"},
		{"id":"role","type":"string","label":"Ρόλος","default":"Video editor"}
	]'
>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Filmareto Inter";
				src: url("../_shared/Inter.ttf");
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#root {
				position: absolute;
				inset: 0;
				font-family: "Filmareto Inter", system-ui, sans-serif;
				color: #fff;
			}
			#place {
				position: absolute;
				left: 6%;
				bottom: 26%;
			}
			@media (min-aspect-ratio: 1/1) {
				#place {
					bottom: 9%;
				}
			}
			#card {
				padding: 2.2vmin 4vmin 2.4vmin 3.4vmin;
				border-radius: 2.6vmin;
				background: rgba(15, 16, 22, 0.86);
				border: 0.18vmin solid rgba(255, 255, 255, 0.22);
				box-shadow: 0 1.4vmin 3.4vmin rgba(0, 0, 0, 0.4);
				animation: card 4s linear 0s 1 both;
				white-space: nowrap;
			}
			#name {
				display: block;
				font-size: 6vmin;
				font-weight: 800;
				letter-spacing: -0.025em;
			}
			#role {
				display: block;
				font-size: 3.4vmin;
				font-weight: 500;
				opacity: 0.75;
				margin-top: 0.5vmin;
			}
			@keyframes card {
				0% {
					opacity: 0;
					transform: translateX(-6vmin);
				}
				9%,
				90% {
					opacity: 1;
					transform: translateX(0);
				}
				100% {
					opacity: 0;
					transform: translateX(-3vmin);
				}
			}
		</style>
	</head>
	<body>
		<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fit-format>
			<div id="place" class="clip" data-start="0" data-duration="4">
				<div id="card" data-start="0">
					<span id="name" data-var-text="name">Νεκτάριος</span>
					<span id="role" data-var-text="role">Video editor</span>
				</div>
			</div>
		</div>
		<script src="../_shared/graphic.js"></script>
	</body>
</html>
