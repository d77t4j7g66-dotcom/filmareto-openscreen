<!doctype html>
<html
	data-graphic-name="Follow"
	data-graphic-hold="3.6"
	data-composition-variables='[
		{"id":"name","type":"string","label":"Όνομα","default":"Filmareto"},
		{"id":"tag","type":"string","label":"Περιγραφή","default":"editing tips"}
	]'
>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Filmareto Inter";
				src: url("../_shared/Inter.ttf");
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#root {
				position: absolute;
				inset: 0;
				font-family: "Filmareto Inter", system-ui, sans-serif;
				color: #fff;
			}
			#place {
				position: absolute;
				left: 50%;
				top: 72%;
				transform: translate(-50%, -50%);
			}
			@media (min-aspect-ratio: 1/1) {
				#place {
					left: auto;
					top: auto;
					right: 5%;
					bottom: 8%;
					transform: none;
				}
			}
			#card {
				display: flex;
				align-items: center;
				gap: 2.6vmin;
				padding: 2.2vmin 2.4vmin 2.2vmin 2.2vmin;
				border-radius: 4vmin;
				background: rgba(15, 16, 22, 0.86);
				border: 0.18vmin solid rgba(255, 255, 255, 0.22);
				box-shadow: 0 1.6vmin 4vmin rgba(0, 0, 0, 0.45);
				animation: card 4s linear 0s 1 both;
				white-space: nowrap;
			}
			#avatar {
				width: 11vmin;
				height: 11vmin;
				border-radius: 50%;
				object-fit: cover;
			}
			#name {
				display: block;
				font-size: 5vmin;
				font-weight: 800;
				letter-spacing: -0.02em;
			}
			#tag {
				display: block;
				font-size: 3.1vmin;
				font-weight: 500;
				opacity: 0.72;
				margin-top: 0.4vmin;
			}
			#button {
				position: relative;
				margin-left: 2vmin;
				width: 21vmin;
				height: 8.2vmin;
				border-radius: 2.6vmin;
				animation: press 4s linear 0s 1 both;
				font-size: 3.6vmin;
				font-weight: 700;
			}
			#button span {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: inherit;
			}
			#follow {
				background: #0a84ff;
				animation: follow 4s linear 0s 1 both;
			}
			#following {
				background: #2c2e36;
				animation: following 4s linear 0s 1 both;
			}
			@keyframes card {
				0% {
					opacity: 0;
					transform: translateY(5vmin) scale(0.9);
				}
				8%,
				90% {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
				100% {
					opacity: 0;
					transform: translateY(2vmin) scale(0.97);
				}
			}
			@keyframes press {
				0%,
				32% {
					transform: scale(1);
				}
				36% {
					transform: scale(0.9);
				}
				41%,
				100% {
					transform: scale(1);
				}
			}
			@keyframes follow {
				0%,
				35% {
					opacity: 1;
				}
				39%,
				100% {
					opacity: 0;
				}
			}
			@keyframes following {
				0%,
				35% {
					opacity: 0;
				}
				39%,
				100% {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body>
		<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-fit-format>
			<div id="place" class="clip" data-start="0" data-duration="4">
				<div id="card" data-start="0">
					<img id="avatar" src="../_shared/filmareto-avatar.jpg" alt="" />
					<div>
						<span id="name" data-var-text="name">Filmareto</span>
						<span id="tag" data-var-text="tag">editing tips</span>
					</div>
					<div id="button" data-start="0">
						<span id="follow" data-start="0">Follow</span>
						<span id="following" data-start="0">Following</span>
					</div>
				</div>
			</div>
		</div>
		<script src="../_shared/graphic.js"></script>
	</body>
</html>
