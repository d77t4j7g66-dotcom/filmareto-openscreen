<!doctype html>
<html
	data-graphic-name="Λέξη"
	data-graphic-hold="1.75"
	data-composition-variables='[
		{"id":"word","type":"string","label":"Λέξη","default":"είναι άθλιο"}
	]'
>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Filmareto Inter";
				src: url("../_shared/Inter.ttf");
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#root {
				position: absolute;
				inset: 0;
				font-family: "Filmareto Inter", system-ui, sans-serif;
			}
			#place {
				position: absolute;
				left: 0;
				right: 0;
				top: 62%;
				text-align: center;
			}
			#pill {
				display: inline-block;
				padding: 1.4vmin 4vmin 1.8vmin;
				border-radius: 2.4vmin;
				background: #ff7a1a;
				color: #fff;
				font-size: 10vmin;
				font-weight: 800;
				font-style: italic;
				letter-spacing: -0.03em;
				white-space: nowrap;
				box-shadow: 0 1.2vmin 3vmin rgba(0, 0, 0, 0.35);
				animation: pop 2s linear 0s 1 both;
			}
			@keyframes pop {
				0% {
					opacity: 0;
					transform: scale(0.7) rotate(-2.5deg);
				}
				6% {
					opacity: 1;
					transform: scale(1.08) rotate(-2.5deg);
				}
				12%,
				87% {
					opacity: 1;
					transform: scale(1) rotate(-2.5deg);
				}
				100% {
					opacity: 0;
					transform: scale(0.94) rotate(-2.5deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="root" data-composition-id="main" data-start="0" data-duration="2" data-fit-format>
			<div id="place" class="clip" data-start="0" data-duration="2">
				<span id="pill" data-start="0" data-var-text="word" data-fit-width="0.8">είναι άθλιο</span>
			</div>
		</div>
		<script src="../_shared/graphic.js"></script>
	</body>
</html>
